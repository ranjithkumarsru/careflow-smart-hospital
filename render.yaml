services:
  - type: web
    name: careflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: careflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@hospital.demo
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: CURRENCY
        value: INR
      - key: CORS_ORIGINS
        fromService:
          name: careflow-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: careflow-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: careflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: careflow-db
    databaseName: careflow
    user: careflow
    postgresMajorVersion: "17"
    plan: free
    ipAllowList: []
